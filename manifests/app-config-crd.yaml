apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appconfigs.stable.example.com
spec:
  group: stable.example.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                appName:
                  type: string
                  description: "应用名称"
                replicas:
                  type: integer
                  minimum: 1
                  description: "副本数量"
                image:
                  type: string
                  description: "容器镜像"
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: "应用端口"
                env:
                  type: array
                  description: "环境变量列表"
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
              required: ["appName", "replicas", "image"]
  scope: Namespaced
  names:
    plural: appconfigs
    singular: appconfig
    kind: AppConfig
    shortNames:
      - ac